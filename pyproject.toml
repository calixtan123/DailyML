[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[project]
name = "daily-ml-practice"
version = "0.1.0"
description = "Local Daily ML Practice app"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.11,<3",
    "PyJWT[crypto]>=2.13,<3",
    "tzdata>=2025.2",
    "uvicorn>=0.34,<1",
]

[project.scripts]
daily-ml = "daily_ml.cli:main"

[dependency-groups]
dev = ["httpx2", "pytest>=8.3,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/daily_ml"]
artifacts = ["/src/daily_ml/web"]

[tool.hatch.build.targets.sdist]
include = ["/src/daily_ml", "/README.md"]
artifacts = ["/src/daily_ml/web"]

[tool.pytest.ini_options]
testpaths = ["tests"]
